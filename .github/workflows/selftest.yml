name: selftest

on:
  push:
  pull_request:

jobs:
  selftest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          locked: true
      - run: pixi run selftest
      # not `pixi run check`: that task uses --allow-errors and would never fail
      - run: pixi run jupyter execute ci/smoke.ipynb
